name: Honkbal Hoofdklasse Standen Scraper
on:
  schedule:
    # GitHub Actions cron draait altijd in UTC, en Nederland wisselt tussen
    # CET (UTC+1) en CEST (UTC+2, zomertijd). Om echt om 09:00
    # Amsterdam-tijd te draaien staan hieronder twee cron-regels (één per
    # tijdzone-variant); de "Check Amsterdam-tijd"-stap hieronder bepaalt
    # welke van de twee triggers de daadwerkelijke run mag uitvoeren en
    # slaat de andere (foute) trigger over.
    - cron: "0 7 * * 5,0"   # 09:00 Amsterdam tijdens CEST (zomertijd)
    - cron: "0 8 * * 5,0"   # 09:00 Amsterdam tijdens CET  (wintertijd)
  workflow_dispatch: {}   # handmatig starten via de Actions-tab (altijd toegestaan)
permissions:
  contents: write
concurrency:
  group: update-knbsb-hoofdklasse
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Amsterdam-tijd
        id: check
        run: |
          uur=$(TZ=Europe/Amsterdam date +%H)
          echo "Huidig uur in Amsterdam: $uur"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$uur" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Niet 09:00 Amsterdam-tijd — deze cron-trigger wordt overgeslagen."
          fi
      - name: Checkout repo
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Setup Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Standen scrapen
        if: steps.check.outputs.run == 'true'
        env:
          # Optioneel: voeg een repo-secret PROXY_URL toe (Settings → Secrets
          # and variables → Actions) met bv. http://user:pass@proxy-host:poort
          # van een residential-proxy-dienst, voor het geval
          # honkbalhoofdklasse.com ook GitHub-runner-IP's blokkeert. Zonder
          # deze secret verandert er niets aan het gedrag.
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py
      - name: Commit & push
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add standen.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in standen.json."
          else
            git commit -m "Update Honkbal Hoofdklasse standen ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
